<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Cage Session — Stadium Slugger</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>⚾ Cage Session</h1>
    <div id="session-status" class="status idle">Ready</div>
  </header>

  <div id="camera-wrap">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="camera-hint">Position the camera where it was calibrated<br>(4 ft high, ~6 ft behind plate, ~6.5 ft toward 1st base)</div>
  </div>

  <div id="source-picker">
    <button id="src-local" class="src active">📷 This device's camera</button>
    <button id="btn-broadcast" class="src">📡 Phone: broadcast camera</button>
    <button id="btn-watch" class="src">📺 Laptop: watch phone</button>
  </div>

  <div id="cast-panel" class="hidden">
    <div id="cast-status"></div>
    <div id="cast-qr"></div>
    <div id="cast-textwrap" class="hidden">
      <textarea id="cast-text" readonly rows="4"></textarea>
      <button id="btn-copy-code">Copy text</button>
    </div>
    <div id="cast-scan-wrap" class="hidden">
      <video id="cast-scan-video" playsinline muted></video>
      <canvas id="cast-scan-canvas" class="hidden"></canvas>
    </div>
    <div id="cast-paste-wrap" class="hidden">
      <textarea id="cast-paste" rows="4" placeholder="Paste the code from the other device"></textarea>
      <button id="btn-apply-code">Apply code</button>
    </div>
    <div id="cast-actions"></div>
    <button id="btn-cast-close">Close</button>
  </div>

  <div id="controls">
    <button id="btn-start" class="big">● Start Live Session</button>
    <button id="btn-stop" class="big hidden" disabled>■ End Session</button>
  </div>
  <label id="clip-toggle-wrap"><input type="checkbox" id="clip-toggle" checked> Save each swing's clip to the folder + replay in the log (~2 MB each)</label>
  <div id="controls2">
    <button id="btn-download" class="hidden" disabled>⬇ Save Swing Log</button>
  </div>

  <div id="live-metrics">
    <div class="metric"><span class="label">Swings</span><span id="m-swings" class="value">0</span></div>
    <div class="metric"><span class="label">Last EV</span><span id="m-ev" class="value">—</span></div>
    <div class="metric"><span class="label">Last LA</span><span id="m-la" class="value">—</span></div>
    <div class="metric"><span class="label">Recording</span><span id="m-rec" class="value">—</span></div>
  </div>

  <h2>Swing Log</h2>
  <div id="swing-log"><p class="empty">No swings yet. Take a cut.</p></div>

  <details id="profile-details">
    <summary>Calibration profile</summary>
    <div id="profile-info">Loading…</div>
    <label id="profile-load">Phone calibration file (wizard export):
      <input type="file" id="profile-file" accept=".json,application/json">
    </label>
    <div id="profile-warn"></div>
  </details>
</div>
<script src="../calibration-wizard/calibration.js"></script>
<script src="vendor/qrcode.min.js?v=20260917c"></script>
<script src="vendor/jsqr.min.js?v=20260917c"></script>
<script src="vendor/lz-string.min.js?v=20260917c"></script>
<script src="cast.js?v=20260917c"></script>
<script src="session.js?v=20260917c"></script>
</body>
</html>
