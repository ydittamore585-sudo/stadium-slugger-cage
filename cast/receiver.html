<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadium Slugger — Cage Display</title>
<!--
  Stadium Slugger Cage Edition — Cast receiver (custom CAF receiver).
  Runs on the TV (e.g. Vizio via built-in Chromecast) as the cage display:
  session status, swing count, and last-swing exit velo / launch angle in
  big type readable from across the garage.

  Message protocol on urn:x-cast:com.stadiumslugger.cage (JSON):
    sender -> receiver
      {type:'session', state:'live'|'idle'|'paused', label?:string}
      {type:'swing', n:number, exitVeloMph:number|null, launchAngleDeg:number|null, at:string}
      {type:'reset'}
    receiver -> sender
      {type:'ready'}

  Setup: register an application in the Google Cast SDK Developer Console,
  point it at this page's HTTPS URL, and put the App ID in cast-sender.js.
  See cast/README.md.
-->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --bg:#0a0e14; --fg:#f2f5f9; --dim:#8b94a3; --accent:#ffb020; --good:#3ddc84; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100vh; overflow:hidden;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:2.5vh 4vw; border-bottom:1px solid #1c2330;
  }
  header h1 { font-size:4.5vh; letter-spacing:.08em; font-weight:800; }
  header h1 .slugger { color:var(--accent); }
  #state {
    font-size:3vh; font-weight:700; padding:1vh 2.5vw; border-radius:999px;
    background:#1c2330; color:var(--dim); letter-spacing:.06em;
  }
  #state.live { background:#12351f; color:var(--good); }
  #state.paused { background:#3a2b10; color:var(--accent); }
  main {
    flex:1; display:grid; grid-template-columns:1.2fr 1fr 1fr;
    gap:3vw; padding:3vh 4vw; min-height:0;
  }
  .card {
    background:#10161f; border:1px solid #1c2330; border-radius:2vh;
    padding:3vh 3vw; display:flex; flex-direction:column; justify-content:center;
  }
  .card h2 { font-size:2.6vh; color:var(--dim); letter-spacing:.12em; margin-bottom:2vh; font-weight:700; }
  #last-swing .big { display:flex; gap:4vw; align-items:baseline; }
  .metric .val { font-size:11vh; font-weight:800; line-height:1; }
  .metric .unit { font-size:3.4vh; color:var(--dim); margin-left:.6vw; font-weight:600; }
  .metric .lbl { font-size:2.4vh; color:var(--dim); letter-spacing:.1em; margin-top:1vh; }
  #swing-num { font-size:3vh; color:var(--dim); margin-top:2.5vh; }
  #swing-num b { color:var(--fg); font-size:4vh; }
  #recent { font-size:2.8vh; }
  #recent ol { list-style:none; }
  #recent li {
    display:flex; justify-content:space-between; gap:2vw;
    padding:1.4vh 0; border-bottom:1px solid #1c2330;
  }
  #recent li .n { color:var(--dim); width:4em; }
  #recent li .m { font-weight:700; }
  #recent li .t { color:var(--dim); font-size:2.2vh; }
  #waiting {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:2vh; background:var(--bg);
  }
  #waiting .pulse { font-size:5vh; color:var(--dim); letter-spacing:.06em; }
  #waiting .hint { font-size:2.6vh; color:#5a6372; }
  footer {
    display:flex; justify-content:space-between; align-items:center;
    padding:1.5vh 4vw; border-top:1px solid #1c2330;
    font-size:2vh; color:#5a6372;
  }
  #refresh {
    background:#1c2330; color:var(--fg); border:0; border-radius:1vh;
    font-size:2.2vh; font-weight:700; padding:1.2vh 2.5vw; cursor:pointer;
  }
</style>
</head>
<body>
<div id="waiting">
  <div class="pulse">STADIUM SLUGGER</div>
  <div class="hint">Cage display ready — cast from the session app to connect</div>
</div>

<header>
  <h1><span class="slugger">STADIUM</span> SLUGGER</h1>
  <div id="state">IDLE</div>
</header>

<main>
  <div class="card" id="last-swing">
    <h2>LAST SWING</h2>
    <div class="big">
      <div class="metric">
        <span class="val" id="ev">--</span><span class="unit">mph</span>
        <div class="lbl">EXIT VELO</div>
      </div>
      <div class="metric">
        <span class="val" id="la">--</span><span class="unit">deg</span>
        <div class="lbl">LAUNCH</div>
      </div>
    </div>
    <div id="swing-num">Swing <b id="swing-n">–</b> <span id="swing-at"></span></div>
  </div>
  <div class="card" id="recent">
    <h2>SESSION</h2>
    <ol id="recent-list"></ol>
  </div>
  <div class="card" id="field-card">
    <h2>BALL FLIGHT</h2>
    <svg id="field" viewBox="0 0 400 400" style="width:100%;height:auto;">
      <!-- Outfield grass -->
      <path d="M 200 380 A 180 180 0 0 1 20 200 L 200 200 Z" fill="#1a3a1a" opacity="0.3"/>
      <path d="M 200 380 A 180 180 0 0 0 380 200 L 200 200 Z" fill="#1a3a1a" opacity="0.3"/>
      <!-- Infield dirt -->
      <path d="M 200 340 L 140 280 L 200 220 L 260 280 Z" fill="#4a3728" opacity="0.5"/>
      <!-- Bases -->
      <rect x="196" y="376" width="8" height="8" fill="#fff" transform="rotate(45 200 380)"/>
      <rect x="136" y="276" width="8" height="8" fill="#fff" transform="rotate(45 140 280)"/>
      <rect x="196" y="216" width="8" height="8" fill="#fff" transform="rotate(45 200 220)"/>
      <rect x="256" y="276" width="8" height="8" fill="#fff" transform="rotate(45 260 280)"/>
      <!-- Pitcher's mound -->
      <ellipse cx="200" cy="300" rx="12" ry="8" fill="#4a3728" opacity="0.5"/>
      <!-- Home plate -->
      <polygon points="200,380 194,374 194,368 206,368 206,374" fill="#fff"/>
      <!-- Fence arc (320 ft) -->
      <path d="M 60 140 A 220 220 0 0 1 340 140" fill="none" stroke="#5a6372" stroke-width="2" stroke-dasharray="8,4"/>
      <text x="200" y="130" text-anchor="middle" fill="#5a6372" font-size="12">320 FT</text>
      <!-- Trajectory path (drawn by JS) -->
      <path id="traj" fill="none" stroke="#ffb020" stroke-width="3" opacity="0"/>
      <!-- Landing marker (drawn by JS) -->
      <circle id="landing" r="8" fill="#ff4444" opacity="0"/>
      <text id="dist-label" x="200" y="50" text-anchor="middle" fill="#ffb020" font-size="20" font-weight="bold" opacity="0">-- ft</text>
    </svg>
    <div id="traj-info" style="margin-top:1vh;font-size:2.2vh;color:var(--dim);text-align:center;">
      Waiting for swing data...
    </div>
  </div>
</main>

<footer>
  <span id="build">cast build 20260920a</span>
  <button id="refresh" type="button">Refresh</button>
</footer>

<script>
(function () {
  'use strict';
  var NAMESPACE = 'urn:x-cast:com.stadiumslugger.cage';
  var MAX_RECENT = 6;

  var el = function (id) { return document.getElementById(id); };
  var stateEl = el('state'), evEl = el('ev'), laEl = el('la'),
      swingNEl = el('swing-n'), swingAtEl = el('swing-at'),
      recentList = el('recent-list'), waiting = el('waiting');

  document.getElementById('refresh').onclick = function () {
    location.replace(location.pathname + '?fresh=' + Date.now());
  };

  function fmt(v, digits) {
    return (typeof v === 'number' && isFinite(v)) ? v.toFixed(digits) : '--';
  }

  function setState(s) {
    var label = { live: 'LIVE', paused: 'PAUSED', idle: 'IDLE' }[s] || 'IDLE';
    stateEl.textContent = label;
    stateEl.className = (s === 'live') ? 'live' : (s === 'paused' ? 'paused' : '');
  }

  function onSwing(msg) {
    evEl.textContent = fmt(msg.exitVeloMph, 1);
    laEl.textContent = fmt(msg.launchAngleDeg, 0);
    swingNEl.textContent = (typeof msg.n === 'number') ? msg.n : '–';
    swingAtEl.textContent = msg.at ? ' · ' + msg.at : '';
    // Draw the trajectory if we have both velo and angle
    if (typeof msg.exitVeloMph === 'number' && typeof msg.launchAngleDeg === 'number') {
      drawTrajectory(msg.exitVeloMph, msg.launchAngleDeg);
    }
    var li = document.createElement('li');
    var evTxt = fmt(msg.exitVeloMph, 1), laTxt = fmt(msg.launchAngleDeg, 0);
    li.innerHTML = '<span class="n">#' + (msg.n || '–') + '</span>' +
      '<span class="m">' + (evTxt === '--' ? '-- mph' : evTxt + ' mph') + ' · ' +
      (laTxt === '--' ? '--°' : laTxt + '°') + '</span>' +
      '<span class="t">' + (msg.at || '') + '</span>';
    recentList.insertBefore(li, recentList.firstChild);
    while (recentList.children.length > MAX_RECENT) {
      recentList.removeChild(recentList.lastChild);
    }
  }

  function onReset() {
    evEl.textContent = '--';
    laEl.textContent = '--';
    swingNEl.textContent = '–';
    swingAtEl.textContent = '';
    recentList.innerHTML = '';
    setState('idle');
    // Clear the field
    el('traj').setAttribute('opacity', '0');
    el('landing').setAttribute('opacity', '0');
    el('dist-label').setAttribute('opacity', '0');
    el('traj-info').textContent = 'Waiting for swing data...';
  }

  // Projectile physics: given exit velo (mph) and launch angle (deg),
  // calculate the range and draw the trajectory on the field diagram.
  // Uses simple projectile motion (no air resistance) — good enough for
  // a visual estimate. Real balls fly ~10-15% shorter due to drag.
  function drawTrajectory(exitVeloMph, launchAngleDeg) {
    var g = 32.2; // ft/s^2
    var vFps = exitVeloMph * 5280 / 3600; // mph to ft/s
    var theta = launchAngleDeg * Math.PI / 180;
    
    // Range = v^2 * sin(2θ) / g
    var rangeFt = (vFps * vFps * Math.sin(2 * theta)) / g;
    
    // SVG: home plate at (200, 380), field extends up
    // Scale: 180px = 180ft (1px per ft for simplicity, capped at fence)
    var maxDisplay = 220; // px (to the fence arc)
    var scale = maxDisplay / 320; // 320ft fence = 220px
    
    var startX = 200, startY = 380;
    var endDist = Math.min(rangeFt, 340); // cap at 340ft for display
    var endX = 200; // straightaway center (we don't have spray angle yet)
    var endY = startY - (endDist * scale);
    
    // Draw a parabolic arc
    var midX = (startX + endX) / 2;
    var peakHeight = (endDist * scale) * 0.3 * Math.sin(theta); // visual apex
    var midY = Math.min(startY, endY) - peakHeight;
    
    var path = 'M ' + startX + ' ' + startY +
               ' Q ' + midX + ' ' + midY +
               ' ' + endX + ' ' + endY;
    
    var traj = el('traj');
    traj.setAttribute('d', path);
    traj.setAttribute('opacity', '1');
    
    var landing = el('landing');
    landing.setAttribute('cx', endX);
    landing.setAttribute('cy', endY);
    landing.setAttribute('opacity', '1');
    
    var label = el('dist-label');
    label.textContent = Math.round(rangeFt) + ' ft';
    label.setAttribute('x', endX);
    label.setAttribute('y', Math.max(30, endY - 15));
    label.setAttribute('opacity', '1');
    
    var info = el('traj-info');
    var result = rangeFt >= 320 ? 'HOME RUN distance!' :
                 rangeFt >= 250 ? 'Deep outfield' :
                 rangeFt >= 150 ? 'Outfield' : 'Infield';
    info.textContent = Math.round(rangeFt) + ' ft projected · ' + result;
    info.style.color = 'var(--fg)';
  }

  function onMessage(event) {
    var msg = event.data;
    if (!msg || typeof msg !== 'object') return;
    waiting.style.display = 'none';
    if (msg.type === 'swing') onSwing(msg);
    else if (msg.type === 'session') setState(msg.state);
    else if (msg.type === 'reset') onReset();
  }

  var context = cast.framework.CastReceiverContext.getInstance();
  context.addCustomMessageListener(NAMESPACE, onMessage);
  context.addEventListener(
    cast.framework.system.EventType.SENDER_CONNECTED, function () {
      waiting.style.display = 'none';
    });
  context.addEventListener(
    cast.framework.system.EventType.SENDER_DISCONNECTED, function () {
      if (context.getSenders().length === 0) setState('idle');
    });

  // Tell any already-watching sender we are up.
  var opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true; // cage display stays up between swings
  context.start(opts);
  // Broadcast readiness; senders that connect later get state on demand.
  try {
    context.sendCustomMessage(NAMESPACE, undefined, { type: 'ready' });
  } catch (e) { /* no senders yet — harmless */ }
})();
</script>
</body>
</html>
